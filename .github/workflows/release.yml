name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build binaries
        run: bun run --cwd packages/makcode build

      - name: Package assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd packages/makcode/dist
          for target in makcode-darwin-arm64 makcode-darwin-x64 makcode-linux-arm64 makcode-linux-x64; do
            [ -d "$target/bin" ] || { echo "missing $target"; continue; }
            case "$target" in
              *darwin*) (cd "$target/bin" && zip -q "$GITHUB_WORKSPACE/release-assets/$target.zip" makcode) ;;
              *linux*)  tar -czf "$GITHUB_WORKSPACE/release-assets/$target.tar.gz" -C "$target/bin" makcode ;;
            esac
          done
          ls -la "$GITHUB_WORKSPACE/release-assets"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v0.0.0-manual-$(date +%Y%m%d%H%M%S)"
            git tag "$TAG" && git push origin "$TAG"
          fi
          gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes || \
          gh release upload "$TAG" release-assets/* --clobber
